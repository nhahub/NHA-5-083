# ==============================================================================
# Build, Push, and Deploy to Azure Container Apps (OIDC Passwordless CI/CD)
# ==============================================================================
#
# Procedure:
#   1. build-and-push: Logs into Azure via OIDC, logs into ACR, and builds/pushes
#      linux/amd64 images (backend, streamlit, pipeline) tagged with :<git-sha>
#      and :latest using GitHub Actions layer caching.
#   2. deploy: Runs ONLY on pushes to `main` OR manual `workflow_dispatch` with
#      `deploy_to_azure=true`. Updates the Container Apps and Scheduled Job to
#      the immutable :<git-sha> image tag.
#
# Security & Required GitHub Configuration:
#   - Passwordless OIDC (`permissions: id-token: write`): GitHub exchanges a
#     short-lived OIDC JWT for an Azure AD token for Managed Identity
#     `id-eatosphere-prod` (requires federated credentials for this repo/branch,
#     `AcrPush` on ACR, and `Contributor` on the target resource group).
#   - Required Repository Secrets (3 identifiers only — zero passwords/keys):
#       AZURE_CLIENT_ID, AZURE_TENANT_ID, AZURE_SUBSCRIPTION_ID
#   - Optional Repository Variables (for forks with custom resource names):
#       ACR_NAME (default: acreatosphere2611)
#       AZURE_RESOURCE_GROUP (default: rg-eatosphere-prod)
#   - Runtime Secret Isolation: Updating `--image` never passes or exposes
#     application secrets in GitHub; DB, Storage, Kaggle, and HF secrets remain
#     in Azure Key Vault and stay bound via Managed Identity (`Key Vault Secrets User`).
# ==============================================================================

name: Build, Push, and Deploy to Azure

on:
  workflow_dispatch:
    inputs:
      deploy_to_azure:
        description: "Roll out updated images to Azure Container Apps & ETL Job (uncheck to publish to ACR only)"
        type: boolean
        required: true
        default: true
  push:
    branches:
      - main
      - refactor/infra-increment1-platform
    paths:
      - "config/**"
      - "pipeline/**"
      - "sql/**"
      - "web/**"
      - ".github/workflows/build-push-acr.yml"

permissions:
  id-token: write
  contents: read

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: backend
            dockerfile: web/backend/Dockerfile
          - name: streamlit
            dockerfile: web/streamlit/Dockerfile
          - name: pipeline
            dockerfile: pipeline/Dockerfile
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Azure Login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Log in to Azure Container Registry
        env:
          ACR_NAME: ${{ vars.ACR_NAME || 'acreatosphere2611' }}
        run: az acr login --name "$ACR_NAME"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push ${{ matrix.name }}
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64
          push: true
          tags: |
            ${{ vars.ACR_NAME || 'acreatosphere2611' }}.azurecr.io/${{ matrix.name }}:${{ github.sha }}
            ${{ vars.ACR_NAME || 'acreatosphere2611' }}.azurecr.io/${{ matrix.name }}:latest
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}

  deploy:
    needs: build-and-push
    if: >-
      (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'workflow_dispatch' && inputs.deploy_to_azure == true)
    runs-on: ubuntu-latest
    env:
      ACR_NAME: ${{ vars.ACR_NAME || 'acreatosphere2611' }}
      AZURE_RG: ${{ vars.AZURE_RESOURCE_GROUP || 'rg-eatosphere-prod' }}
      IMAGE_TAG: ${{ github.sha }}
    steps:
      - name: Azure Login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Ensure Container Apps CLI extension
        run: az extension add --name containerapp --upgrade -y

      - name: Roll out FastAPI Backend
        run: |
          az containerapp update \
            --name ca-eatosphere-backend \
            --resource-group "$AZURE_RG" \
            --image "${ACR_NAME}.azurecr.io/backend:${IMAGE_TAG}"

      - name: Roll out Streamlit Frontend
        run: |
          az containerapp update \
            --name ca-eatosphere-streamlit \
            --resource-group "$AZURE_RG" \
            --image "${ACR_NAME}.azurecr.io/streamlit:${IMAGE_TAG}"

      - name: Update Weekly ETL Scheduled Job
        run: |
          az containerapp job update \
            --name job-eatosphere-etl \
            --resource-group "$AZURE_RG" \
            --image "${ACR_NAME}.azurecr.io/pipeline:${IMAGE_TAG}"
