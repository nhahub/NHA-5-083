# ==============================================================================
# CI Quality Gates (Formatting, Linting, Type Checking, and Tests)
# ==============================================================================
#
# Procedure:
#   1. Triggers on pull requests to `main`, pushes to `main` or
#      `refactor/infra-increment1-platform`, and manual `workflow_dispatch`.
#   2. Installs Python 3.12 dependencies with pip caching across `pipeline/`,
#      `web/backend/`, and `web/streamlit/`.
#   3. Runs four mandatory quality gates in order:
#      - `ruff format --check pipeline web tests`
#      - `ruff check pipeline web tests`
#      - `mypy .`
#      - `pytest -v` (unit, architecture boundaries, DAG import, AppTest smoke)
#
# Security & Environment Model:
#   - Zero Repository Secrets required: all `env:` values below are synthetic
#     CI placeholders (`APP_ENV=ci`) that satisfy `pydantic-settings` `SecretStr`
#     fail-fast validation without touching any real database or external API.
#   - Minimal permissions (`GITHUB_TOKEN` default read-only checkout).
# ==============================================================================

name: CI Quality Gates

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
      - refactor/infra-increment1-platform
  workflow_dispatch:

jobs:
  quality-gates:
    runs-on: ubuntu-latest
    env:
      APP_ENV: ci
      MYSQL_HOST: 127.0.0.1
      MYSQL_PORT: "3306"
      MYSQL_DATABASE: global_restaurant_explorer
      MYSQL_TLS_ENABLED: "FALSE"
      MYSQL_APP_USER: ci_app
      MYSQL_APP_PASSWORD: ci_app_password
      MYSQL_PIPELINE_USER: ci_pipeline
      MYSQL_PIPELINE_PASSWORD: ci_pipeline_password
      KAGGLE_USERNAME: ci_kaggle_user
      KAGGLE_KEY: ci_kaggle_key
      HF_API_KEY: ci_hf_key
      STREAMLIT_BACKEND_URL: http://127.0.0.1:8000
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            pipeline/requirements.txt
            web/backend/requirements.txt
            web/streamlit/requirements.txt

      - name: Install dependencies and quality tools
        run: |
          python -m pip install --upgrade pip
          pip install -r pipeline/requirements.txt -r web/backend/requirements.txt -r web/streamlit/requirements.txt
          pip install ruff mypy pytest

      - name: Check formatting (ruff format)
        run: ruff format --check pipeline web tests

      - name: Lint code (ruff check)
        run: ruff check pipeline web tests

      - name: Static type check (mypy)
        run: mypy .

      - name: Run test suite (pytest)
        run: pytest -v
