# ==============================================================================
# Mirror Repository History to NHA Academy Repository (https://github.com/nhahub/NHA-5-083)
# ==============================================================================
#
# Procedure:
#   1. Triggers daily at 03:00 UTC or via manual `workflow_dispatch` with
#      `source_ref`, `destination_branch`, and `dry_run` (`true` by default).
#   2. Fetches full commit/tag history from this repository into `sync-workspace`.
#   3. When `dry_run == 'false'`, fetches the destination NHA repo, verifies a
#      clean fast-forward (`git merge-base --is-ancestor`) so unexpected remote
#      commits are never overwritten, pushes exact commit history (and `v*` tags),
#      and writes a run summary to `$GITHUB_STEP_SUMMARY`.
#
# Security & Required GitHub Configuration:
#   - Required Repository Secret: `NHA_REPO_TOKEN` — fine-grained or classic
#     Personal Access Token (PAT) with `repo` / `Contents: Read & Write` scope
#     for both this repository and the target NHA repository.
#   - Required Repository Variable: `NHA_REPO` (e.g., `nhahub/NHA-5-083`).
#   - Concurrency lock (`sync-to-nha`, `cancel-in-progress: false`) prevents
#     overlapping pushes; `permissions: contents: read` restricts the local
#     `GITHUB_TOKEN`.
# ==============================================================================

name: Sync to NHA repository

on:
  workflow_dispatch:
    inputs:
      source_ref:
        description: "Branch or tag to sync"
        required: true
        default: "main"
      destination_branch:
        description: "Branch to update in the NHA repository"
        required: true
        default: "main"
      dry_run:
        description: "Validate only; do not push"
        required: true
        default: "true"
        type: choice
        options:
          - "true"
          - "false"

  schedule:
    # Runs daily at 03:00 UTC. Adjust or remove if manual sync is preferred.
    - cron: "0 3 * * *"

permissions:
  contents: read

concurrency:
  group: sync-to-nha
  cancel-in-progress: false

jobs:
  sync:
    name: Mirror selected ref to NHA repository
    runs-on: ubuntu-latest

    steps:
      - name: Print sync configuration
        run: |
          echo "Source repository: ${{ github.repository }}"
          echo "Source ref: ${{ inputs.source_ref || 'main' }}"
          echo "Destination repository: ${{ vars.NHA_REPO }}"
          echo "Destination branch: ${{ inputs.destination_branch || 'main' }}"
          echo "Dry run: ${{ inputs.dry_run || 'true' }}"

      - name: Configure Git
        run: |
          git config --global user.name "nha-sync-bot"
          git config --global user.email "nha-sync-bot@users.noreply.github.com"

      - name: Fetch source repository history
        env:
          SOURCE_REPO: ${{ github.repository }}
          SOURCE_REF: ${{ inputs.source_ref || 'main' }}
        run: |
          git init sync-workspace
          cd sync-workspace

          git remote add source \
            "https://x-access-token:${{ secrets.NHA_REPO_TOKEN }}@github.com/${SOURCE_REPO}.git"

          git fetch --prune --tags source \
            "+refs/heads/*:refs/remotes/source/*" \
            "+refs/tags/*:refs/tags/*"

          git checkout -B source-ref "source/${SOURCE_REF}"

      - name: Resolve source commit
        working-directory: sync-workspace
        run: |
          SOURCE_COMMIT="$(git rev-parse HEAD)"
          echo "SOURCE_COMMIT=${SOURCE_COMMIT}" >> "$GITHUB_ENV"

          echo "Syncing commit:"
          git log -1 --pretty=format:"%H%nAuthor: %an <%ae>%nCommitter: %cn <%ce>%nDate: %ad%nSubject: %s"

      - name: Fetch NHA Academy repository
        if: inputs.dry_run == 'false'
        env:
          NHA_TOKEN: ${{ secrets.NHA_REPO_TOKEN }}
          NHA_REPO: ${{ vars.NHA_REPO }}
          DEST_BRANCH: ${{ inputs.destination_branch || 'main' }}
        working-directory: sync-workspace
        run: |
          git remote add destination \
            "https://x-access-token:${NHA_TOKEN}@github.com/${NHA_REPO}.git"

          git fetch --prune --tags destination \
            "+refs/heads/*:refs/remotes/destination/*" \
            "+refs/tags/*:refs/tags/*"

      - name: Check destination branch state
        if: inputs.dry_run == 'false'
        working-directory: sync-workspace
        run: |
          DEST_BRANCH="refs/remotes/destination/${{ inputs.destination_branch || 'main' }}"

          if git show-ref --verify --quiet "$DEST_BRANCH"; then
            if git merge-base --is-ancestor "$DEST_BRANCH" HEAD; then
              echo "Destination branch is behind or identical to the selected source ref."
              echo "A fast-forward update is possible."
            else
              echo "::error::The NHA branch contains commits that are not present in the selected source ref."
              echo "::error::This may mean someone pushed directly to the academic repository."
              echo ""
              git log --oneline --graph --decorate \
                "$DEST_BRANCH" "$SOURCE_COMMIT" -30
              exit 1
            fi
          else
            echo "Destination branch does not exist; it will be created."
          fi

      - name: Dry-run summary
        if: inputs.dry_run == 'true'
        working-directory: sync-workspace
        run: |
          echo "Dry run enabled; no changes were pushed."
          echo ""
          echo "Would sync:"
          echo "  From: ${{ github.repository }} @ ${{ inputs.source_ref || 'main' }}"
          echo "  Commit: ${SOURCE_COMMIT}"
          echo "  To: ${{ vars.NHA_REPO }} @ ${{ inputs.destination_branch || 'main' }}"

      - name: Push exact commit history to NHA
        if: inputs.dry_run == 'false'
        env:
          NHA_TOKEN: ${{ secrets.NHA_REPO_TOKEN }}
          NHA_REPO: ${{ vars.NHA_REPO }}
          DEST_BRANCH: ${{ inputs.destination_branch || 'main' }}
        working-directory: sync-workspace
        run: |
          # Pushes the existing source commits without rewriting them.
          # This preserves author, committer, commit message, timestamps, and parent history.
          git push destination \
            "HEAD:refs/heads/${DEST_BRANCH}"

      - name: Sync matching tag
        if: inputs.dry_run == 'false' && startsWith(inputs.source_ref || 'main', 'v')
        env:
          NHA_TOKEN: ${{ secrets.NHA_REPO_TOKEN }}
          SOURCE_REF: ${{ inputs.source_ref || 'main' }}
        working-directory: sync-workspace
        run: |
          TAG="${SOURCE_REF}"

          if git rev-parse -q --verify "refs/tags/${TAG}" >/dev/null; then
            git push destination "refs/tags/${TAG}"
          else
            echo "Selected source ref is not an existing tag; no tag was synced."
          fi

      - name: Add job summary
        if: always()
        run: |
          {
            echo "## NHA sync result"
            echo ""
            echo "| Field | Value |"
            echo "|---|---|"
            echo "| Source repository | \`${{ github.repository }}\` |"
            echo "| Source ref | \`${{ inputs.source_ref || 'main' }}\` |"
            echo "| Source commit | \`${SOURCE_COMMIT:-not resolved}\` |"
            echo "| Destination repository | \`${{ vars.NHA_REPO }}\` |"
            echo "| Destination branch | \`${{ inputs.destination_branch || 'main' }}\` |"
            echo "| Dry run | \`${{ inputs.dry_run || 'true' }}\` |"
          } >> "$GITHUB_STEP_SUMMARY"
